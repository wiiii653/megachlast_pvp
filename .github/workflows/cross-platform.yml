name: Cross Platform CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: Linux-x86_64
          - os: macos-14
            platform: macOS-arm64
          - os: windows-latest
            platform: Windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxrandr-dev libxcursor-dev libxi-dev libudev-dev libflac-dev libvorbis-dev libgl1-mesa-dev libfreetype-dev xvfb patchelf
      - name: macOS packaging tools
        if: runner.os == 'macOS'
        run: brew install dylibbundler
      - name: Configure with automatic SFML download
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSFML_PROVIDER=FETCH -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DSFML_USE_STATIC_STD_LIBS=ON
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Linux tests
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build -C Release --output-on-failure
      - name: Windows and macOS tests
        if: runner.os != 'Linux'
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package and verify runtime dependencies
        run: python scripts/package_release.py --build build --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: megachlast-${{ matrix.platform }}
          path: release/*.zip
          if-no-files-found: error
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxrandr-dev libxcursor-dev libxi-dev libudev-dev libflac-dev libvorbis-dev libgl1-mesa-dev libfreetype-dev xvfb
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSFML_PROVIDER=FETCH -DENABLE_SANITIZERS=ON -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build --parallel 3
      - name: Test
        run: xvfb-run -a ctest --test-dir build --output-on-failure
  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-test, sanitizers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: megachlast-*
          merge-multiple: true
      - name: Publish verified archives
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$(find release-assets -name '*.zip' | wc -l)" -eq 3
          (cd release-assets && sha256sum *.zip > SHA256SUMS.txt)
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Megachlast PvP $GITHUB_REF_NAME" \
            --notes "Extract the ZIP matching your platform. Linux: Ubuntu 24.04 or newer, launch play.sh. macOS: Apple Silicon, launch play.command (not notarized). Windows: x64, launch play.bat. SFML, non-system runtime dependencies, assets and license notices are included. See SHA256SUMS.txt for checksums." \
            "${release_flags[@]}"
